[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chartagent"
version = "0.1.0"
description = "An embeddable agentic chart-creation library for Python."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sharim Raza" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "duckdb>=1",
    "pyarrow>=14",
    "tzdata>=2024; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/thearcscode/chartagent"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/README.md",
]

[tool.hatch.build.targets.wheel.force-include]
"src/chartagent/_bundle/flint.iife.js" = "chartagent/_bundle/flint.iife.js"
"src/chartagent/frame/vocab.json" = "chartagent/frame/vocab.json"
"src/chartagent/py.typed" = "chartagent/py.typed"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "prototypes",
    "design",
    "explainers",
    "src/chartagent/frame/_generated.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
